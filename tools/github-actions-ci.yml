name: Verify and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint TypeScript and React
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build Chromium and Firefox
        run: npm run build
      - name: Validate Firefox extension
        run: npm run lint:firefox
      - name: Package unsigned Firefox extension
        run: npm run package:firefox
      - name: Upload unsigned Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: markmind-firefox-unsigned
          path: artifacts/markmind-firefox-*.zip
          if-no-files-found: error
          retention-days: 14
